# USB HID only — no Bluetooth stack, no wireless pairing or advertising.
# Input is sent only to the host this device is plugged into via USB.
# See: https://zmk.dev/docs/config/system (output types) and app Kconfig ZMK_BLE / ZMK_USB.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=y

# Matrix debounce: 1 ms press was too low — encoder activity can couple into the scan and
# register as a ghost press on nearby matrix positions (e.g. the Ins / Firefox chord).
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=12

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
